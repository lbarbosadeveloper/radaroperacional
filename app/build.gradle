plugins {
    id 'com.android.application'
}

android {
    namespace 'com.leo.meucartv'
    compileSdk 35

    defaultConfig {
        applicationId 'com.leo.meucartv'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
    }

    signingConfigs {
        // Chave fixa no repositório: cada APK novo instala por cima do anterior sem desinstalar.
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // SDK não oficial do Android Auto (o mesmo que o Fermata Auto usa) para desenhar na tela do carro.
    implementation files('libs/aauto.aar')
    // Alinha as versões do Kotlin trazidas pelas bibliotecas abaixo (evita classes duplicadas).
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    // Bibliotecas de que o aauto.aar precisa.
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.fragment:fragment:1.8.5'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.core:core:1.13.1'

    testImplementation 'junit:junit:4.13.2'
}
