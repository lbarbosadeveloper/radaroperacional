name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Ferramentas do Android
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME"

      - name: Testes
        run: gradle --no-daemon testDebugUnitTest

      - name: Montar APK
        run: gradle --no-daemon assembleDebug

      - name: Renomear APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MeuCarTV.apk

      - name: Guardar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: MeuCarTV-apk
          path: MeuCarTV.apk

      - name: Publicar na página de Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Meu CarTV (build ${{ github.run_number }})
          files: MeuCarTV.apk
          body: APK gerado automaticamente a partir do commit ${{ github.sha }}.
