name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Ferramentas do Android
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME"

      - name: Testes
        run: gradle --no-daemon testDebugUnitTest

      - name: Montar APK
        shell: bash
        run: |
          set +e
          gradle --no-daemon assembleDebug --stacktrace > build.log 2>&1
          code=$?
          tail -n 200 build.log
          if [ $code -ne 0 ]; then
            # Devolve o trecho do erro como anotação, legível pela API do GitHub.
            python3 - <<'PY'
          import re
          lines = open("build.log", encoding="utf-8", errors="replace").read().splitlines()
          keys = re.compile(r"What went wrong|ERROR|[Ee]rror:|Exception|FAILED|[Ff]ailed|^> |Caused by")
          hits = [l[:300] for l in lines if keys.search(l)][:60]
          msg = "\n".join(hits) or "\n".join(lines[-40:])
          msg = msg.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
          print("::error title=Falha ao montar APK::" + msg)
          PY
            exit 1
          fi

      - name: Renomear APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MeuCarTV.apk

      - name: Guardar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: MeuCarTV-apk
          path: MeuCarTV.apk

      - name: Publicar na página de Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Meu CarTV (build ${{ github.run_number }})
          files: MeuCarTV.apk
          body: APK gerado automaticamente a partir do commit ${{ github.sha }}.
